<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#030006">
<title>MJ — Galaxy Cinematic Masterpiece</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600&display=swap');

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #030006;
  color: #ffffff;
  font-family: 'Inter', Arial, sans-serif;
}

body {
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

#space {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  transition: filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
}

#space.blur {
  filter: blur(12px) brightness(0.45);
}

.vignette {
  position: fixed;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  background: radial-gradient(circle at 50% 45%, transparent 15%, rgba(2, 0, 8, 0.35) 55%, rgba(2, 0, 8, 0.92) 100%);
}

.top {
  position: fixed;
  top: 25px;
  left: 0;
  right: 0;
  z-index: 10;
  text-align: center;
  pointer-events: none;
}

.top small {
  font-size: 9px;
  letter-spacing: 6px;
  opacity: 0.8;
  color: #ffb3de;
  text-shadow: 0 0 10px #ff1493;
  text-transform: uppercase;
}

.top h1 {
  font: 52px 'Great Vibes', cursive;
  color: #ffd7ee;
  text-shadow: 0 0 15px #ff1493, 0 0 35px #ff1493, 0 0 50px #ff1493;
  margin-top: 2px;
}

.intro {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 50% 45%, #350028, #0b0012 45%, #020006);
  transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), visibility 1.2s cubic-bezier(0.16, 1, 0.3, 1);
}

.intro.hide {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.card {
  width: min(440px, 88vw);
  padding: 45px 32px;
  text-align: center;
  border-radius: 30px;
  background: rgba(11, 3, 20, 0.82);
  border: 1px solid rgba(255, 141, 204, 0.35);
  box-shadow: 0 0 70px rgba(255, 20, 147, 0.35), inset 0 0 30px rgba(255, 105, 180, 0.15);
  backdrop-filter: blur(22px);
}

.card h2 {
  font: 64px 'Great Vibes', cursive;
  color: #ffd2eb;
  text-shadow: 0 0 25px #ff1493;
}

.card p {
  margin: 12px 0 26px;
  font-size: 12px;
  line-height: 1.85;
  letter-spacing: 1.5px;
  color: #e4c8df;
  text-transform: uppercase;
}

.enter {
  border: 0;
  border-radius: 35px;
  padding: 16px 32px;
  color: #ffffff;
  font-weight: 600;
  font-size: 13px;
  letter-spacing: 1.8px;
  background: linear-gradient(90deg, #ff167c, #a52cff);
  box-shadow: 0 0 35px rgba(255, 20, 147, 0.6);
  cursor: pointer;
  opacity: 0.35;
  pointer-events: none;
  transition: all 0.4s ease;
}

.enter.ready {
  opacity: 1;
  pointer-events: auto;
}

.enter.ready:hover {
  transform: scale(1.04);
  box-shadow: 0 0 50px rgba(255, 20, 147, 0.95);
}

.loader-wrap {
  width: 200px;
  margin: 22px auto 0;
  text-align: center;
}

.loader-bar {
  height: 4px;
  width: 100%;
  background: #35132f;
  border-radius: 4px;
  overflow: hidden;
}

.loader-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, #ff70ca, #a52cff);
  transition: width 0.25s ease;
}

.loader-text {
  font-size: 10px;
  color: #ff9bdc;
  margin-top: 10px;
  letter-spacing: 1.2px;
  text-transform: uppercase;
}

.photo {
  position: fixed;
  z-index: 40;
  left: 50%;
  top: 50%;
  width: min(340px, 80vw);
  height: min(470px, 72vh);
  transform: translate(-50%, -50%) scale(0.7);
  opacity: 0;
  visibility: hidden;
  transition: transform 0.7s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
  border-radius: 28px;
  border: 1px solid rgba(255, 194, 229, 0.7);
  box-shadow: 0 0 85px rgba(255, 20, 147, 0.55);
  background: #10000f;
}

.photo.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%, -50%) scale(1);
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(to top, rgba(5, 0, 8, 0.96) 0%, rgba(5, 0, 8, 0.4) 40%, transparent 100%);
}

.photo .copy {
  position: absolute;
  z-index: 2;
  left: 22px;
  right: 22px;
  bottom: 24px;
  text-align: center;
}

.copy h3 {
  font: 42px 'Great Vibes', cursive;
  color: #ffc3e5;
  text-shadow: 0 0 15px #ff1493;
}

.copy p {
  font-size: 11px;
  line-height: 1.8;
  margin-top: 6px;
  color: #fce8f5;
  font-weight: 300;
  letter-spacing: 0.5px;
}

#flash {
  position: fixed;
  inset: 0;
  z-index: 80;
  background: #ffffff;
  opacity: 0;
  pointer-events: none;
}

#flash.go {
  animation: flashAnim 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}

@keyframes flashAnim {
  0% { opacity: 0; }
  20% { opacity: 0.85; }
  100% { opacity: 0; }
}

@media (max-height: 700px) {
  .top h1 { font-size: 42px; }
  .photo { height: 420px; }
  .card h2 { font-size: 54px; }
}
</style>
</head>
<body>

<canvas id="space"></canvas>
<div class="vignette"></div>

<div class="top">
  <small>A LITTLE UNIVERSE MADE SPECIALLY YOU</small>
</div>

<div class="intro" id="intro">
  <div class="card">
    <h2>For MJ</h2>
    <p>A tiny galaxy of stars, memories and good wishes.<br>Tap below and let the universe begin.</p>
    <button class="enter" id="enter">START EXPERIENCE ♡</button>
    <div class="loader-wrap" id="loaderWrap">
      <div class="loader-bar"><div class="loader-fill" id="loaderFill"></div></div>
      <div class="loader-text" id="loaderText">Preparing Universe... 0%</div>
    </div>
  </div>
</div>

<div id="flash"></div>

<div class="photo" id="photo">
  <img id="photoImg" alt="MJ Photo">
  <div class="copy">
    <h3 id="photoTitle">A Beautiful Soul</h3>
    <p id="photoText">May every new chapter bring you peace, growth and beautiful memories.</p>
  </div>
</div>

<audio id="music" loop preload="auto">
  <source src="https://files.catbox.moe/q1li1p.m4a" type="audio/mp4">
</audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// Data Configurations
const PHOTOS = [
  "https://files.catbox.moe/a35wzo.jpg",
  "https://files.catbox.moe/sx9alb.jpg",
  "https://files.catbox.moe/w9a5jl.jpg",
  "https://files.catbox.moe/iys824.jpg",
  "https://files.catbox.moe/sj23q9.jpg",
  "https://files.catbox.moe/hifg98.jpg",
  "https://files.catbox.moe/3rcy38.jpg",
  "https://files.catbox.moe/le40za.jpg",
  "https://files.catbox.moe/d2fjxo.jpg",
  "https://files.catbox.moe/pdsgap.jpg",
  "https://files.catbox.moe/9th0nt.jpg",
  "https://files.catbox.moe/u7b0o6.jpg",
  "https://files.catbox.moe/s4n0ll.jpg",
  "https://files.catbox.moe/8t2zxl.jpg"
];

const MSG = [
  ["A Beautiful Soul", "May your days be filled with peace, light and reasons to smile."],
  ["Golden Moment", "Some memories deserve their own little place among the stars."],
  ["New Chapter", "May Allah guide every step and make every new experience fruitful."],
  ["Pure Grace", "Keep shining in your own quiet and beautiful way."],
  ["A Little Light", "Even the smallest light can make a dark sky feel different."],
  ["Keep Growing", "May this season bring knowledge, growth and beautiful memories."],
  ["Peace", "May your heart always find calm wherever your journey takes you."],
  ["Special Memory", "One frame can hold a whole story."],
  ["Three Months, Many Memories", "May your SIWES journey be easy, safe and full of good experiences."],
  ["Keep Smiling", "A simple smile can change the atmosphere around it."],
  ["Star Moment", "Some moments simply deserve to be remembered."],
  ["Good Things Ahead", "May what comes next be better than you imagined."],
  ["A New Adventure", "New place. New lessons. New memories."],
  ["For MJ ✨", "May Allah protect you, guide you and bless your journey."]
];

// Global Engine Variables
let scene, camera, renderer, galaxy, heart, stars, rings, photos, meteors = [], meshes = [];
let clock = new THREE.Clock();

// State Machine Engine
const STATE_INTRO = 0;
const STATE_HARMONIC_SWEEP = 1;
const STATE_ZOOM_IN = 2;
const STATE_DISPLAY_PHOTO = 3;
const STATE_ZOOM_OUT = 4;

let currentState = STATE_INTRO;
let stateTimer = 0;
let activePhotoIndex = -1;
let remainingIndices = [];

// Camera Motion Vectors & Oscillators
let camCurrentPos = new THREE.Vector3(0, 140, 320);
let camTargetPos = new THREE.Vector3(0, 140, 320);
let camLookAtCurrent = new THREE.Vector3(0, 0, 0);
let camLookAtTarget = new THREE.Vector3(0, 0, 0);
let harmonicAngle = 0;

// Asset Preloader logic
let loadedImagesCount = 0;
function preloadAssets() {
  PHOTOS.forEach(url => {
    const img = new Image();
    img.src = url;
    img.onload = () => {
      loadedImagesCount++;
      let pct = Math.floor((loadedImagesCount / PHOTOS.length) * 100);
      document.getElementById("loaderFill").style.width = pct + "%";
      document.getElementById("loaderText").textContent = "Preparing Universe... " + pct + "%";
      if (loadedImagesCount >= PHOTOS.length) {
        document.getElementById("loaderWrap").style.display = "none";
        document.getElementById("enter").classList.add("ready");
      }
    };
    img.onerror = () => { loadedImagesCount++; };
  });
}

// Random Index Selector without repetitions
function getNextRandomIndex() {
  if (remainingIndices.length === 0) {
    for (let i = 0; i < PHOTOS.length; i++) {
      remainingIndices.push(i);
    }
  }
  const randomIndex = Math.floor(Math.random() * remainingIndices.length);
  return remainingIndices.splice(randomIndex, 1)[0];
}

// Three.js Core Initialization
function init() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x030007, 0.0038);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1200);
  camera.position.copy(camCurrentPos);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("space"),
    antialias: true,
    alpha: true
  });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);

  galaxy = new THREE.Group();
  rings = new THREE.Group();
  photos = new THREE.Group();
  scene.add(galaxy, rings, photos);

  buildGalaxy();
  buildStars();
  buildHeart();
  buildRings();
  buildPhotos();
  buildMeteors();

  window.addEventListener("resize", onWindowResize);
  preloadAssets();
  animate();
}

// Galaxy Core Generation
function buildGalaxy() {
  const count = 48000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);

  const colInner = new THREE.Color("#ff007f");
  const colMid = new THREE.Color("#ff66c4");
  const colOuter = new THREE.Color("#7c3aed");

  for (let i = 0; i < count; i++) {
    let r = Math.pow(Math.random(), 2.15) * 44 + 1;
    let arm = ((i % 5) * Math.PI * 2) / 5;
    let angle = arm + r * 1.42 + (Math.random() - 0.5) * 0.45;

    positions[i * 3] = Math.cos(angle) * r + (Math.random() - 0.5) * 1.6;
    positions[i * 3 + 1] = (Math.random() - 0.5) * (2.2 + 26 / r);
    positions[i * 3 + 2] = Math.sin(angle) * r + (Math.random() - 0.5) * 1.6;

    let mixedColor = r < 14 
      ? colInner.clone().lerp(colMid, r / 14) 
      : colMid.clone().lerp(colOuter, (r - 14) / 30);

    colors[i * 3] = mixedColor.r;
    colors[i * 3 + 1] = mixedColor.g;
    colors[i * 3 + 2] = mixedColor.b;
  }

  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

  const material = new THREE.PointsMaterial({
    size: 0.135,
    vertexColors: true,
    transparent: true,
    opacity: 0.88,
    blending: THREE.AdditiveBlending
  });

  galaxy.add(new THREE.Points(geometry, material));
}

// Background Starfield
function buildStars() {
  const count = 12000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    positions[i * 3] = (Math.random() - 0.5) * 320;
    positions[i * 3 + 1] = (Math.random() - 0.5) * 220;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 320;
  }

  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
  
  const material = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.22,
    transparent: true,
    opacity: 0.75
  });

  stars = new THREE.Points(geometry, material);
  scene.add(stars);
}

// 3D Central Heart Structure
function buildHeart() {
  const count = 10000;
  const geometry = new THREE.BufferGeometry();
  const positions = new Float32Array(count * 3);

  for (let i = 0; i < count; i++) {
    let t = Math.random() * Math.PI * 2;
    let f = Math.pow(Math.random(), 0.55);
    let x = 16 * Math.pow(Math.sin(t), 3) * 0.38 * f;
    let y = (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * 0.38 * f;

    positions[i * 3] = x;
    positions[i * 3 + 1] = y + 7;
    positions[i * 3 + 2] = (Math.random() - 0.5) * 2.5 * f;
  }

  geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

  const material = new THREE.PointsMaterial({
    color: 0xff4fb8,
    size: 0.2,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending
  });

  heart = new THREE.Points(geometry, material);
  galaxy.add(heart);
}

// Text Canvas Generator
function createTextSprite(text) {
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");
  canvas.width = 750;
  canvas.height = 100;

  ctx.font = "600 32px Inter";
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffffff";
  ctx.shadowColor = "#ff1493";
  ctx.shadowBlur = 20;
  ctx.fillText(text, 375, 60);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0.88 });
  const sprite = new THREE.Sprite(material);
  sprite.scale.set(11.5, 1.4, 1);
  return sprite;
}

// Rotating Text Rings
function buildRings() {
  const phrases = [
    "MJ ✨", "BEAUTIFUL SOUL", "PEACE", "NEW CHAPTER",
    "KEEP SHINING", "MAY ALLAH GUIDE YOU", "SIWES JOURNEY", "GOOD MEMORIES"
  ];

  phrases.forEach((t, i) => {
    let sprite = createTextSprite(t);
    let angle = (i * Math.PI * 2) / phrases.length;
    sprite.userData = { angle: angle, radius: 13.5 + i * 0.92, speed: 0.0007 + i * 0.0001 };
    rings.add(sprite);
  });
}

// Photo Placements in 3D Space
function buildPhotos() {
  const loader = new THREE.TextureLoader();

  PHOTOS.forEach((url, i) => {
    let texture = loader.load(url);
    let material = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide, transparent: true });
    let mesh = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 5.0), material);

    let angle = (i / PHOTOS.length) * Math.PI * 2;
    mesh.position.set(Math.cos(angle) * 26, (i % 3 - 1) * 3.4, Math.sin(angle) * 26);
    mesh.userData = { index: i };

    photos.add(mesh);
    meshes.push(mesh);
  });
}

// Shooting Stars / Meteors
function buildMeteors() {
  for (let i = 0; i < 6; i++) {
    const geometry = new THREE.BufferGeometry();
    const pos = new Float32Array(6);
    geometry.setAttribute("position", new THREE.BufferAttribute(pos, 3));

    const material = new THREE.LineBasicMaterial({ color: 0xffb6c1, transparent: true, opacity: 0 });
    const line = new THREE.Line(geometry, material);
    resetMeteor(line);
    scene.add(line);
    meteors.push(line);
  }
}

function resetMeteor(line) {
  line.userData = {
    x: (Math.random() - 0.5) * 240,
    y: Math.random() * 100 + 20,
    z: (Math.random() - 0.5) * 240,
    dx: -(Math.random() * 2.2 + 1.6),
    dy: -(Math.random() * 2.2 + 1.6),
    dz: -(Math.random() * 1.6),
    len: Math.random() * 10 + 6,
    life: 0,
    maxLife: Math.random() * 60 + 40
  };
}

function updateMeteors() {
  meteors.forEach(m => {
    let u = m.userData;
    u.life++;
    if (u.life > u.maxLife) {
      resetMeteor(m);
      m.material.opacity = 0;
    } else {
      u.x += u.dx;
      u.y += u.dy;
      u.z += u.dz;

      const pos = m.geometry.attributes.position.array;
      pos[0] = u.x;
      pos[1] = u.y;
      pos[2] = u.z;
      pos[3] = u.x - u.dx * (u.len / 2);
      pos[4] = u.y - u.dy * (u.len / 2);
      pos[5] = u.z - u.dz * (u.len / 2);

      m.geometry.attributes.position.needsUpdate = true;
      m.material.opacity = Math.sin((u.life / u.maxLife) * Math.PI);
    }
  });
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// Modal Card Triggers
function openPhotoModal(i) {
  document.getElementById("photoImg").src = PHOTOS[i];
  document.getElementById("photoTitle").textContent = MSG[i][0];
  document.getElementById("photoText").textContent = MSG[i][1];

  document.getElementById("photo").classList.add("show");
  document.getElementById("space").classList.add("blur");

  let flash = document.getElementById("flash");
  flash.classList.remove("go");
  void flash.offsetWidth;
  flash.classList.add("go");
}

function closePhotoModal() {
  document.getElementById("photo").classList.remove("show");
  document.getElementById("space").classList.remove("blur");
}

// Master Animation Engine State Machine
function animate() {
  requestAnimationFrame(animate);

  let delta = clock.getDelta();
  let elapsedTime = clock.getElapsedTime();

  // Background Animations
  galaxy.rotation.y += 0.0006;
  stars.rotation.y -= 0.0001;

  if (heart) {
    heart.rotation.y += 0.0015;
    let s = 1 + Math.sin(elapsedTime * 3) * 0.06;
    heart.scale.set(s, s, s);
  }

  rings.children.forEach(o => {
    o.userData.angle += o.userData.speed;
    o.position.x = Math.cos(o.userData.angle) * o.userData.radius;
    o.position.z = Math.sin(o.userData.angle) * o.userData.radius;
  });

  meshes.forEach(o => o.lookAt(camera.position));
  updateMeteors();

  // Orchestration Machine
  if (currentState !== STATE_INTRO) {
    stateTimer += delta;

    switch (currentState) {

      case STATE_ZOOM_OUT:
        // Transitioning back to high center view
        camTargetPos.set(
          Math.cos(harmonicAngle) * 90,
          65 + Math.sin(elapsedTime * 1.5) * 15,
          Math.sin(harmonicAngle) * 90
        );
        camLookAtTarget.set(0, 0, 0);

        if (stateTimer > 2.0) {
          stateTimer = 0;
          currentState = STATE_HARMONIC_SWEEP;
        }
        break;

      case STATE_HARMONIC_SWEEP:
        // Simple Harmonic Motion + Fast 3D Orbiting
        harmonicAngle += delta * 1.8;
        
        // Simple Harmonic Motion equation for Y-axis oscillation
        let shmY = Math.sin(harmonicAngle * 2.5) * 28;

        camTargetPos.set(
          Math.cos(harmonicAngle) * 75,
          25 + shmY,
          Math.sin(harmonicAngle) * 75
        );
        camLookAtTarget.set(0, 0, 0);

        // Fast sweep before picking next random target
        if (stateTimer > 2.5) {
          stateTimer = 0;
          activePhotoIndex = getNextRandomIndex();
          currentState = STATE_ZOOM_IN;
        }
        break;

      case STATE_ZOOM_IN:
        // Diving straight into selected photo
        let targetMesh = meshes[activePhotoIndex];
        let pPos = targetMesh.position;

        camTargetPos.set(pPos.x * 1.32, pPos.y + 0.8, pPos.z * 1.32);
        camLookAtTarget.copy(pPos);

        if (stateTimer > 2.2) {
          stateTimer = 0;
          openPhotoModal(activePhotoIndex);
          currentState = STATE_DISPLAY_PHOTO;
        }
        break;

      case STATE_DISPLAY_PHOTO:
        // Hold on Photo Display
        if (stateTimer > 5.0) {
          closePhotoModal();
          stateTimer = 0;
          currentState = STATE_ZOOM_OUT;
        }
        break;
    }
  }

  // Smooth Camera Interpolation (Lerp)
  camCurrentPos.lerp(camTargetPos, 0.042);
  camLookAtCurrent.lerp(camLookAtTarget, 0.042);

  camera.position.copy(camCurrentPos);
  camera.lookAt(camLookAtCurrent);

  renderer.render(scene, camera);
}

// Trigger Execution
document.getElementById("enter").onclick = async () => {
  document.getElementById("intro").classList.add("hide");
  currentState = STATE_HARMONIC_SWEEP;
  stateTimer = 0;

  try {
    await document.getElementById("music").play();
  } catch (e) {
    console.log("Audio playback initiated.");
  }
};

window.onload = () => {
  init();
};
</script>
</body>
</html>
